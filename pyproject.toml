[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afd-e2e"
version = "0.1.0"
description = "Portable DeepSeek AFD inference and accuracy tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
eval = ["httpx>=0.27", "lm_eval[api]==0.4.12", "datasets==4.4.1", "pyarrow==21.0.0", "PyYAML>=6"]
yaml = ["PyYAML>=6"]
test = ["pytest>=8", "httpx>=0.27", "PyYAML>=6"]

[project.scripts]
afd-e2e = "afd_e2e.cli:main"

[tool.setuptools.packages.find]
include = ["afd_e2e*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

